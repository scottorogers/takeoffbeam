[unix_http_server]
file=/tmp/takeoff-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/takeoff-supervisor.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/takeoff-supervisor.sock

[program:desktop]
command=/usr/bin/Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:window-manager]
command=/opt/takeoff/wait-for-display.sh /usr/bin/openbox
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
; Keep XDamage and disable copyrect/wireframe optimizations: GTK dialogs must repaint.
command=/opt/takeoff/wait-for-display.sh /usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -nopw -forever -shared -xkb -noxrecord -noscrollcopyrect -nowf
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=/opt/takeoff/wait-for-display.sh /usr/bin/dbus-run-session -- /usr/local/bin/takeoff-desk
directory=/drawings
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
